<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#22584c">
  <meta name="description" content="Reservia — tüm işletmelerin için tek rezervasyon alanı. Etkileşimli ürün demosu.">
  <title>Reservia — İşletmelerim</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2322584c'/%3E%3Ctext x='11' y='29' font-size='28' font-family='Arial' font-weight='bold' fill='white'%3Er%3C/text%3E%3C/svg%3E">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="M4 4h6M4 8h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 2-2.5 2-2.5 4M12 17h.01"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
  </defs></svg>
  <aside class="sidebar">
    <a href="#" class="brand" onclick="app.view('businesses');return false"><span class="brandmark">r<span>·</span></span>reservia<span class="brand-dot">.</span></a>
    <div class="workspace-label">ÇALIŞMA ALANIN</div>
    <button class="workspace-switch" onclick="app.view('businesses')"><span class="workspace-icon">C</span><span><strong id="business-name">Can'ın çalışma alanı</strong><small>İşletme yönetimi</small></span><span class="chevrons">⌃<br>⌄</span></button>
    <div class="nav-label">YÖNETİM</div>
    <nav>
      <button data-nav="businesses" onclick="app.view('businesses')" class="nav-item active"><svg><use href="#i-grid"/></svg>İşletmelerim <span class="nav-count">3</span></button>
      <button data-nav="overview" onclick="app.view('overview')" class="nav-item"><svg><use href="#i-home"/></svg>Genel bakış</button>
      <button data-nav="calendar" onclick="app.view('calendar')" class="nav-item"><svg><use href="#i-calendar"/></svg>Takvim</button>
      <button data-nav="bookings" onclick="app.view('bookings')" class="nav-item"><svg><use href="#i-list"/></svg>Rezervasyonlar <span class="nav-count nav-count-pending" id="pending-count"></span></button>
      <button data-nav="settings" onclick="app.view('settings')" class="nav-item"><svg><use href="#i-settings"/></svg>Randevu ayarları</button>
      <button data-nav="editor" onclick="app.view('editor')" class="nav-item"><svg><use href="#i-edit"/></svg>Sayfa düzenleyici</button>
    </nav>
    <div class="sidebar-bottom"><div class="help-card"><span class="help-spark"><svg><use href="#i-spark"/></svg></span><strong>Birlikte başlayalım.</strong><p>İşletmeni birkaç adımda<br>rezervasyona hazır hale getir.</p><button onclick="app.modal('guide')">Hızlı başlangıç <span>↗</span></button></div><button class="help-link" onclick="app.modal('guide')"><svg><use href="#i-help"/></svg>Yardım merkezi <span>↗</span></button><button class="account" onclick="app.modal('login')"><span class="user-avatar">CA</span><span><strong id="account-name">Can Arslan</strong><small>Demo hesabı</small></span><span class="chevrons">⌃<br>⌄</span></button></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb"><span>Çalışma alanı</span><span class="crumb-slash">/</span><strong id="crumb">İşletmelerim</strong></div><div class="top-actions"><span class="demo-badge"><i></i>İnteraktif demo</span><button class="icon-btn notification" aria-label="Bildirimler" onclick="app.notifications()"><svg><use href="#i-bell"/></svg><i></i></button><button class="icon-btn" id="theme-toggle" onclick="app.toggleTheme()" aria-label="Temayı değiştir"></button><span class="header-divider"></span><button class="top-login" onclick="app.modal('login')">Giriş / Kayıt <span>↗</span></button></div></header>
    <main><div class="page-bar"><span id="page-title">İşletmelerim</span><span class="today" id="header-date"></span></div><div id="content"></div><footer><span>İyi deneyimler, iyi planlarla başlar.</span><span>reservia <b>·</b> İşletmen için daha fazlası.</span></footer></main>
  </div>
  <div id="modal-layer" class="modal-layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="supabase-config.js"></script>
  <script>
    (function(){
      const c=window.RESERVIA_SUPABASE||{};
      if(c.url&&c.anonKey){
        document.body.classList.add('cloud-loading');
        const s=document.createElement('script');s.type='module';s.src='cloud-app.js';
        s.onerror=function(){document.getElementById('content').innerHTML='<div class="empty">Canlı uygulama yüklenemedi. Bağlantınızı veya Supabase ayarlarını kontrol edin.</div>';document.body.classList.remove('cloud-loading');};
        document.body.appendChild(s);
      }else if(c.url||c.anonKey){
        document.body.classList.add('cloud-guest');
        document.getElementById('content').innerHTML='<div class="empty">Supabase URL ve anon key birlikte girilmelidir. supabase-config.js dosyasını kontrol edin.</div>';
      }else{
        const s=document.createElement('script');s.src='app.js';
        s.onload=function(){const x=document.createElement('script');x.src='app-extra.js';document.body.appendChild(x);};
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
